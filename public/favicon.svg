<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#fdfcff"/>
  <g fill="none" stroke="#0a0a0a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer d20 hexagon -->
    <path d="M50 7 L87.6 28.5 L87.6 71.5 L50 92 L12.4 71.5 L12.4 28.5 Z"/>
    <!-- central face (holds 20) -->
    <path d="M30 38 L70 38 L58 65 L42 65 Z"/>
    <!-- lower face (holds 11) -->
    <path d="M42 65 L58 65 L50 92 Z"/>
    <!-- edges to the outer vertices -->
    <path d="M50 7 L30 38 M50 7 L70 38
             M12.4 28.5 L30 38 M87.6 28.5 L70 38
             M12.4 71.5 L30 38 M87.6 71.5 L70 38
             M12.4 71.5 L42 65 M87.6 71.5 L58 65"/>
  </g>
  <g fill="#0a0a0a" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="30.5" y="26" font-size="13" transform="rotate(-8 30.5 26)">4</text>
    <text x="69.5" y="26" font-size="13" transform="rotate(8 69.5 26)">5</text>
    <text x="50" y="54" font-size="16">20</text>
    <text x="50" y="80" font-size="12.5" transform="rotate(6 50 80)">11</text>
  </g>
</svg>
